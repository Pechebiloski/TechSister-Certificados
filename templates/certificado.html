<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4 landscape; margin: 0; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: 'Times New Roman', serif; 
            background-color: #fff9f9;
        }

        .moldura {
            width: 297mm; height: 210mm;
            box-sizing: border-box;
            padding: 12px;
            position: relative;
        }
        
        .borda-interna {
            width: 100%; height: 100%;
            border: 4px solid #d81b60;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* LOGO */
        .logo { margin-bottom: 20px; }
        .logo img { width: 180px; }

        /* JANELINHA DO WINDOWS */
        .janelinha {
            position: absolute; top: 30px; right: 40px;
            width: 150px; border: 2px solid #333;
            background: #fff; box-shadow: 3px 3px 0 #d81b60;
        }
        .barra-titulo {
            background: #ffb6c1; border-bottom: 2px solid #333;
            padding: 3px 8px; font-family: 'Courier New', monospace;
            font-size: 12px; display: flex; justify-content: space-between;
        }
        .conteudo-janelinha { padding: 15px; text-align: center; font-size: 16px; font-family: 'Arial', sans-serif; font-weight: bold;}

        /* TEXTOS CENTRAIS */
        .titulo { font-size: 38px; color: #d81b60; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; font-weight: normal; }
        .subtitulo { font-size: 18px; font-family: 'Arial', sans-serif; margin-bottom: 15px; }
        .nome-participante { font-size: 48px; color: #d81b60; font-family: 'Georgia', serif; font-weight: bold; margin: 10px 0 20px 0; text-align: center; max-width: 80%; line-height: 1.1; }
        .texto-corpo { font-size: 18px; line-height: 1.5; font-family: 'Arial', sans-serif; text-align: center; max-width: 80%; margin-bottom: 50px; }
        .texto-corpo strong { color: #d81b60; }

        /* ÁREA DE REALIZAÇÃO (Sem assinaturas fixas) */
        .realizacao-container {
            position: absolute;
            bottom: 100px; 
            width: 100%;
            text-align: center;
        }
        .realizacao-texto { font-family: 'Arial', sans-serif; font-size: 14px; color: #555; margin-bottom: 5px;}
        .realizacao-nome { font-family: 'Georgia', serif; font-size: 24px; color: #d81b60; font-weight: bold; }

        /* QR Code e Rodapé */
        .qrcode-container { position: absolute; bottom: 25px; left: 40px; text-align: center; width: 80px;}
        .qrcode-container img { width: 70px; }
        .qrcode-label { font-size: 8px; font-family: 'Arial', sans-serif; color: #777; margin-top: 3px; }

        .codigo-validacao { 
            position: absolute; bottom: 25px; right: 40px; font-size: 10px; 
            font-family: 'Arial', sans-serif; border: 1px solid #d81b60; 
            padding: 8px 15px; border-radius: 15px; color: #333; text-align: right; 
        }
    </style>
</head>
<body>
    <div class="moldura">
        <div class="borda-interna">
            
            <!-- LOGO -->
            <div class="logo">
                <!-- <img src="file:///workspaces/TechSister-Certificados/static/img/logo.png"> -->
                <h2 style="color: #d81b60; font-family: 'Georgia', serif; margin: 0; font-size: 36px;">TECH <span style="font-family: 'Brush Script MT', cursive;">Sisters</span></h2>
            </div>

            <!-- JANELINHA DO EVENTO -->
            <div class="janelinha">
                <div class="barra-titulo"><span>📁</span> <span>❌</span></div>
                <div class="conteudo-janelinha">{{ evento }}</div>
            </div>

            <!-- CONTEÚDO PRINCIPAL -->
            <h1 class="titulo">Certificado de Participação</h1>
            
            <div class="subtitulo">Certificamos que</div>
            
            <div class="nome-participante">{{ nome_participante }}</div>
            
            <div class="texto-corpo">
                participou do evento <strong>{{ evento }}</strong>,<br>
                com carga horária total de <strong>{{ carga_horaria }}</strong>.
            </div>

            <!-- ÁREA DE REALIZAÇÃO DINÂMICA -->
            <div class="realizacao-container">
                <div class="realizacao-texto">Realização</div>
                <div class="realizacao-nome">{{ organizadores }}</div>
            </div>

            <!-- QR CODE -->
            <div class="qrcode-container">
                <img src="data:image/png;base64,{{ qr_code_base64 }}">
                <div class="qrcode-label">Escaneie para validar</div>
            </div>

            <!-- RODAPÉ -->
            <div class="codigo-validacao">
                Código: <strong>{{ token }}</strong> <br>
                Valide em: {{ url_validacao }}
            </div>

        </div>
    </div>
</body>
</html>
