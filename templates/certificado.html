<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        
        @page { 
            size: A4 landscape; 
            margin: 0; 
        }
        
        body { 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #fdf2f8; 
        }
        
        
        .container {
            width: 297mm; 
            height: 210mm; 
            box-sizing: border-box; 
            border: 15px solid #d81b60; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            text-align: center;
            position: relative;
            page-break-after: avoid; 
        }
        
        h1 { color: #d81b60; font-size: 32px; margin: 0 0 10px 0; letter-spacing: 2px; }
        .subtitulo { font-size: 18px; color: #555; margin: 0 0 20px 0; }
        .nome { font-size: 42px; font-weight: bold; color: #ad1457; margin: 10px 0; font-family: 'Georgia', serif; }
        .texto { font-size: 18px; color: #333; line-height: 1.4; margin-bottom: 20px; }
        
        .qr-container img { width: 100px; height: 100px; margin-top: 10px; }
        
        
        .rodape { 
            font-size: 10px; 
            color: #777; 
            position: absolute; 
            bottom: 15px; 
            width: 90%; 
            text-align: center; 
        }
        .codigo { font-weight: bold; color: #d81b60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CERTIFICADO DE PARTICIPAÇÃO</h1>
        <p class="subtitulo">Certificamos que</p>
        
        <div class="nome">{{ nome_participante }}</div>
        
        <p class="texto">
            participou do evento <strong>{{ evento }}</strong>,<br>
            promovido pela Tech Sisters, com carga horária total de <strong>{{ carga_horaria }} horas</strong>.
        </p>
        
        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_code_base64 }}">
        </div>
        
        <div class="rodape">
            Código de validação: <span class="codigo">{{ token }}</span><br>
            Valide em: https://techsisters.com.br/validar/{{ token }}
        </div>
    </div>
</body>
</html>
