<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Emissão de Certificados - Tech Sisters</title>
    
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 8px solid #d81b60; }
        h1 { color: #d81b60; text-align: center; margin-bottom: 30px; font-size: 24px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #d81b60; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #ad1457; }
    
    </style>
</head>

<body>
    <div class="container">
        <h1>Tech Sisters</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Emissão de Certificados em Massa</p>
        
       
        <form action="/gerar-certificados-em-massa" method="post" enctype="multipart/form-data">
            <label for="arquivo_csv">Planilha de Presença (CSV)</label>
            <input type="file" name="arquivo_csv" id="arquivo_csv" accept=".csv" required>
            
            <label for="evento">Nome do Evento</label>
            <input type="text" name="evento" id="evento" placeholder="Ex: Tech Girls Night #01" required>
            
            <label for="carga_horaria">Carga Horária (horas)</label>
            <input type="number" name="carga_horaria" id="carga_horaria" min="1" placeholder="Ex: 3" required>
            
            <button type="submit">Gerar e Enviar Certificados</button>
        </form>
    </div>
</body>
</html>
